app:
  name: "strategy-agent"
  environment: "development"
  log_level: "DEBUG"
  data_retention_days: 30
  max_workers: 4
  batch_size: 1000

# Trading Configuration (for future use)
trading:
  enabled: false
  api_key_example: "your_exchange_api_key"
  api_secret_example: "your_exchange_api_secret"

redis:
  host: "localhost"
  port: 6379
  db: 0
  decode_responses: true
  socket_timeout: 5
  socket_connect_timeout: 5

binance:
  rest_api_base: "https://api.binance.com"
  websocket_base: "wss://stream.binance.com:9443"
  symbol: "BTCFDUSD"
  rate_limit_requests_per_minute: 1200
  timeout: 30

data_collector:
  depth_snapshot:
    limit: 5000
    update_interval_seconds: 60
    # Removed window_size as depth_snapshot_5000 now uses single-key overwrite mechanism
  order_flow:
    websocket_url: "wss://stream.binance.com:9443/ws/btcfdusd@aggTrade"
    window_size_minutes: 7200 # 48 hours
    price_precision: 1.0  # $1 precision for aggregation
    aggregation_interval_seconds: 60

analyzer:
  deepseek:
    enable: true
    api_key: "sk-2ce70cb7d88e44c19d65524b990b192b"  # 从环境变量获取API密钥
    base_url: "https://api.deepseek.com/v1"
    model: "deepseek-chat"
    max_tokens: 6000  # 增加token限制以支持统一分析
    temperature: 0.1
    timeout: 90  # 增加超时时间以支持统一分析
    max_retries: 3
    use_unified_analysis: true  # 启用统一分析模式
  analysis:
    interval_seconds: 300
    min_order_volume_threshold: 0.01
    support_resistance_threshold: 0.1
  price_aggregation:
    precision: 1.0  # $1 precision for depth snapshot price aggregation
    enabled: true
    max_price_levels: 5000
  volume_profile_aggregation_precision: 10.0  # $10 precision for Volume Profile aggregation
  trading_event_publisher:
    enable: true  # 交易事件发布功能开关
    redis:
      host: "localhost"  # 外部Redis服务器地址
      port: 6379  # Redis端口
      db: 0  # Redis数据库
      password: null  # Redis密码（可选）
      channel: "hft_grid_strategy_params" # 发布Channel名称
      timeout: 5  # 连接超时时间（秒）
      max_retries: 3  # 最大重试次数
    validation:
      min_grid_delta: 0.1  # 最小价差
      max_grid_delta: 100.0  # 最大价差
      min_grid_quantity: 0.0001  # 最小挂单量
      max_grid_quantity: 10.0  # 最大挂单量
  visualization:
    enabled: false
    price_aggregation_precision: 1.0  # $1 precision (kept for backward compatibility)
    chart_width: 1920
    chart_height: 1080
    chart_dpi: 300
    chart_style: "seaborn-v0_8"
    output_base_path: "./visualizations/order_book/"
    retention_days: 7
    auto_cleanup: true

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file_path: "logs/strategy_agent.log"
  max_file_size_mb: 100
  backup_count: 5
